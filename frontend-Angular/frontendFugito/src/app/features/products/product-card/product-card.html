<div>
<div class="card bg-base-100 w-96 shadow-2xl">

  <figure>
    <img
      [src]=" product.imageUrl || 'https://img.icons8.com/office/40/no-image.png'"
      [alt]="product.name || 'No Name'" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">{{product.name}}</h2>
    <p>{{product.description}}</p>

    <p class="text-2xl">{{product.price | currency: 'COP'}}</p>
    <div class="card-actions justify-end">
      <button class="btn btn-primary" (click)="onAddToCart()">Agregar al Carro </button>
    </div>
  </div>
</div>
</div>
